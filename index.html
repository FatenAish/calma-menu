<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f0e9">
  <title>Calma Menu — 7th Circle</title>
  <style>
    html,body {min-height:100%;margin:0;background:#f7f0e9;color:#4b382a}
    body {display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif}
    .loading {text-align:center;padding:25px}
    .loading strong {font-size:32px;letter-spacing:.16em}
    .loading p {font-size:14px}
    .loading a {color:inherit}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <strong>CALMA</strong><p lang="ar" dir="rtl">جاري تحميل منيو كالما</p>
  </div>
  <script>
    (async () => {
      try {
        const response = await fetch('./optimized-menu.html?v=20261122-final-row-6', {cache:'no-store'});
        if (!response.ok) throw Error('Menu source unavailable');
        let html = await response.text();
        if (!html.includes('</body>')) throw Error('Menu source invalid');
        html = html.replace(/<\/body>/i, '<script src="./menu-override.js?v=20261122-final-row-6"></' + 'script>' + '<script src="./food-override.js?v=20261019-food-menu-restored"></' + 'script>' + '<script src="./shisha-override.js?v=20261117-special-550"></' + 'script>' + '<script src="./menu-extras.js?v=20261022-all-beverages-footer"></' + 'script>' + '<script src="./ui-override.js?v=20261017-remove-language-toggle"></' + 'script>' + '<script>document.querySelectorAll(\'[data-menu-category="dessertsMenu"],#dessertsMenu\').forEach(function(el){el.remove();});</' + 'script>' + '<script src="./menu-fees.js?v=20261022-fees-after-addons-fix"></' + 'script>' + '<script>document.querySelectorAll(\'article.product-card[data-menu-name="Popcorn"] .price\').forEach(function(el){el.setAttribute(\'data-price\',\'1.50\');el.setAttribute(\'aria-label\',\'1.50 Jordanian dinars\');el.innerHTML=\'1.50<span class="price-currency">JOD</span>\';});</' + 'script>' + '<script>(function(){for(const id of [\"hotProducts\",\"coldProducts\"]){const grid=document.getElementById(id);if(!grid||grid.querySelector(\".calma-extra-shot\"))continue;const note=document.createElement(\"div\");note.className=\"calma-extra-shot\";note.style.cssText=\"grid-column:1/-1;flex-basis:100%;width:100%;box-sizing:border-box;text-align:center;padding:12px;color:#60432e;font-weight:600\";note.innerHTML=\"Extra Espresso Shot — 0.50 JOD <span lang=ar dir=rtl style=display:block>إضافة شوت إسبريسو</span>\";grid.append(note);}const head=document.querySelector(\".calma-shisha [data-menu-name=\\\\\\\"Head Replacement\\\\\\\"]\");if(head&&!document.querySelector(\".calma-shisha [data-menu-name=\\\\\\\"Hose Replacement\\\\\\\"]\")){const row=head.cloneNode(true);row.dataset.menuName=\"Hose Replacement\";row.querySelector(\".cs-ar\").textContent=\"تجديد بربيش صحي\";row.querySelector(\".cs-price\").firstChild.textContent=\"0.50\";head.after(row);}})();</script>' + '</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('loading').innerHTML =
        '<strong>CALMA</strong><p>Could not load menu.</p><p><a href="./original-menu.html">Open original menu</a></p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
