<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f0e9">
  <title>Calma Menu — 7th Circle</title>
  <style>
    html,body {min-height:100%;margin:0;background:#f7f0e9;color:#4b382a}
    body {display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif}
    .loading {text-align:center;padding:25px}
    .loading strong {font-size:32px;letter-spacing:.16em}
    .loading p {font-size:14px}
    .loading a {color:inherit}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <strong>CALMA</strong><p lang="ar" dir="rtl">جاري تحميل منيو كالما</p>
  </div>
  <script>
    (async () => {
      try {
        const response = await fetch('./optimized-menu.html', {cache:'force-cache'});
        if (!response.ok) throw Error('Menu source unavailable');
        let html = await response.text();
        if (!html.includes('</body>')) throw Error('Menu source invalid');
        html = html.replace(/<\/body>/i, '<script src="./menu-override.js?v=20261020-iced-shaken-labels"></' + 'script>' + '<script src="./food-override.js?v=20261019-food-menu-restored"></' + 'script>' + '<script src="./shisha-override.js?v=20261018-calma-special-names"></' + 'script>' + '<script src="./menu-extras.js?v=20261022-all-beverages-footer"></' + 'script>' + '<script src="./desserts-override.js?v=20261021-matilda-photo-fix"></' + 'script>' + '<script src="./ui-override.js?v=20261017-remove-language-toggle"></' + 'script>' + '<script src="./whole-price-adjust.js?v=20261020-espresso-exception"></' + 'script>' + '<script src="./menu-fees.js?v=20261022-one-shared-footer"></' + 'script>' + '</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('loading').innerHTML =
        '<strong>CALMA</strong><p>Could not load menu.</p><p><a href="./original-menu.html">Open original menu</a></p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
