name: Optimize CALMA menu images
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/optimize_menu.py'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/optimize_menu.py
      - name: Publish optimized HTML and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimized-menu.html assets/menu-photos
          if ! git diff --cached --quiet; then
            git commit -m "Publish lightweight CALMA menu photos"
            git push
          fi
